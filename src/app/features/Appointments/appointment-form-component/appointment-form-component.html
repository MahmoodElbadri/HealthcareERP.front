<div class="form-wrapper mt-5 mb-5 px-3">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      
      <div class="card premium-card border-0 shadow-lg slide-in">
        <div class="card-header premium-header border-0 text-center">
          <h1 class="header-title mb-0">Book Appointment</h1>
          <p class="header-subtitle mt-2 mb-0">Schedule a new visit for your patient</p>
        </div>
        
        <div class="card-body px-5 py-5">
          <form [formGroup]="addAppointment" (ngSubmit)="onSubmit()" class="premium-form">
            
            <div class="row mb-4">
              <div class="col-md-6 mb-4 mb-md-0">
                <div class="form-group custom-input-group">
                  <label for="appointmentDate" class="custom-label">
                    <i class="bi bi-calendar3 me-2 text-primary"></i>Appointment Date
                  </label>
                  <input
                    type="date"
                    class="form-control custom-input"
                    id="appointmentDate"
                    formControlName="appointmentDate"
                  />
                </div>
              </div>
              
              <div class="col-md-6">
                <div class="form-group custom-input-group">
                  <label for="patientId" class="custom-label">
                    <i class="bi bi-person me-2 text-primary"></i>Patient
                  </label>
                  <div class="select-wrapper">
                    <select class="form-select custom-input" id="patientId" formControlName="patientId">
                      <option value="" disabled selected>Select Patient...</option>
                      @for (patient of patients; track $index) {
                        <option [value]="patient.id">
                          {{ patient.name }}
                        </option>
                      }
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-md-12">
                <div class="form-group custom-input-group">
                  <label for="doctorId" class="custom-label">
                    <i class="bi bi-heart-pulse me-2 text-primary"></i>Doctor
                  </label>
                  <div class="select-wrapper">
                    <select class="form-select custom-input" id="doctorId" formControlName="doctorId">
                      <option value="" disabled selected>Select Doctor...</option>
                      @for (doctor of doctors; track $index) {
                        <option [value]="doctor.id">
                          Dr. {{ doctor.name }}
                        </option>
                      }
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="row mb-5">
              <div class="col-md-12">
                <div class="form-group custom-input-group">
                  <label for="notes" class="custom-label">
                    <i class="bi bi-journal-text me-2 text-primary"></i>Notes
                  </label>
                  <textarea 
                    class="form-control custom-input custom-textarea" 
                    id="notes" 
                    formControlName="notes"
                    placeholder="Add any special instructions, symptoms, or medical history..."
                  ></textarea>
                </div>
              </div>
            </div>

            <div class="form-actions d-flex flex-column flex-sm-row gap-3 mt-2 pt-4 border-top custom-border">
              <button type="submit" class="btn btn-primary premium-btn btn-submit flex-grow-1" [disabled]="!addAppointment.valid">
                <i class="bi bi-check-circle me-2"></i> Confirm Appointment
              </button>
              <button type="button" class="btn btn-outline-danger premium-btn btn-cancel flex-grow-1">
                <i class="bi bi-x-circle me-2"></i> Cancel
              </button>
            </div>
            
          </form>
        </div>
      </div>
      
    </div>
  </div>
</div>
